name: Dev Beta Release

# On every push to dev, tag HEAD with the beta version from the
# spec and publish a GitHub prerelease. The Release event fires the
# COPR webhook (configured to listen for Releases only, not raw
# Pushes), which triggers the actual RPM build.
#
# Skips when the spec's version hasn't changed since the previous
# release — typo-fix commits don't create duplicate tags or kick off
# redundant COPR builds.

# workflow_dispatch is the manual fallback: a push made by GITHUB_TOKEN
# (e.g. the Bump version workflow's PR auto-merging) does not start other
# workflows, so if a bump lands without this firing, run it by hand. It
# reads the spec and skips when the tag already exists, so running it
# spuriously is harmless.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Extract version from steelvoicemix-dev.spec
        id: version
        run: |
          VERSION=$(grep '^Version:' steelvoicemix-dev.spec | awk '{print $2}')
          if [ -z "$VERSION" ]; then
            echo "Could not parse Version: from steelvoicemix-dev.spec" >&2
            exit 1
          fi
          # Whitelist the shape before it reaches any later command. This
          # value is interpolated into shell steps below, so a spec typo
          # like `1.0$(cmd)` must never get that far.
          if ! printf '%s' "$VERSION" \
              | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(~beta[0-9]+)?$'; then
            echo "Refusing unrecognised Version: '$VERSION'" >&2
            exit 1
          fi
          # Tags can't contain ~ (RPM pre-release separator). Convert to
          # a hyphen so v0.3.2~beta1 becomes v0.3.2-beta1 — the spec
          # keeps the ~ for proper RPM vercmp ordering.
          TAG="v${VERSION//\~/-}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.tag_check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Dev beta $VERSION"
          git push origin "$TAG"

      - name: Create GitHub prerelease
        if: steps.tag_check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Best-effort changelog: most recent commit subject + body.
          NOTES=$(git log -1 --pretty=format:'%s%n%n%b' HEAD)
          gh release create "$TAG" \
              --prerelease \
              --title "Dev $VERSION" \
              --notes "$NOTES"
