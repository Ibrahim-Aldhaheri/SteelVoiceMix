name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Read-only token: CI only builds and tests, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust build + test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # linux-native-basic-udev in hidapi dlopens libudev at runtime; the
      # dev header package is still the simplest way to satisfy pkg-config
      # probes that some transitive crates run during their build.rs.
      - name: Install libudev headers
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo build --release
        run: cargo build --release --locked

      - name: cargo test
        run: cargo test --locked --all-targets

      - name: cargo clippy (warnings are errors)
        run: cargo clippy --all-targets --no-deps --locked -- -D warnings

  python:
    name: Python + GUI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: py_compile all modules
        # Walks every .py under the repo (entry shims, gui/, gui/tabs/,
        # CLI). Catches syntax errors in any tab module, not just the
        # top-level gui/ package.
        run: |
          set -e
          find . -name '*.py' -not -path './target/*' -not -path './.git/*' -print0 \
            | xargs -0 python3 -m py_compile
      - name: Install GUI test deps
        # PySide6-Essentials is the runtime the GUI imports; the offscreen
        # Qt platform plugin needs a couple of system libs even with no
        # display. Kept out of the RPM (which uses the distro PySide6) —
        # this is CI-only tooling.
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt
      - name: Run GUI + logic tests
        # Offscreen Qt: constructs every screen, drives interactions,
        # and asserts behaviour — the real safety net beyond compilation.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m pytest tests/ -q
      - name: Validate translation .ts XML
        # The Qt linguist .ts files are XML; a malformed entry would
        # crash the GUI's QTranslator at startup. Cheap to check here.
        run: |
          set -e
          # Filenames go through argv, never spliced into the Python
          # source — a quote in a future filename would otherwise be
          # executable code here. -n1 keeps this a single-line command.
          find gui/translations -name '*.ts' -print0 \
            | xargs -0 -n1 python3 -c 'import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])'
