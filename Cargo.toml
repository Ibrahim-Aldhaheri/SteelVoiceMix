[package]
name = "steelvoicemix"
version = "0.4.3-beta.6"
edition = "2021"
description = "ChatMix for SteelSeries Arctis Nova Pro Wireless on Linux"
license = "GPL-3.0-only"

[[bin]]
name = "steelvoicemix"
path = "src/main.rs"

# Lint policy lives here rather than only in the CI command line, so a
# plain `cargo clippy` (and rust-analyzer, if you point it at clippy)
# reproduces what CI enforces instead of you finding out after a push.
#
# Deliberately clippy-only and deliberately NOT `[lints.rust]`: these are
# tool lints that rustc ignores, so `cargo build` and `cargo run` are
# unaffected and an unused variable never blocks you mid-iteration. CI
# additionally passes `-D warnings`, which does promote rustc's own
# warnings — that stays a CI-side gate on purpose.
#
# Default group only. `pedantic`/`nursery` are opinionated and partly
# unfinished; the default set is already tuned to "probably a bug or
# genuinely worse code". priority = -1 so individual `allow`s added
# below would win over the group.
[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
ctrlc = "3.4"
libc = "0.2"
thiserror = "2"
# rusb provides libusb's hotplug callback API. We use it only for
# USB add/remove events (VID 0x1038 + PID 0x12E0); hidapi still owns
# the actual HID I/O. The watcher gives instant post-suspend reconnect
# instead of waiting for the battery-poll watchdog to fire.
rusb = "0.9"

[dependencies.ggoled_lib]
path = "ggoled_lib"
package = "ggoled_lib"
